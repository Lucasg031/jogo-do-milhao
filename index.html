<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jogo do Milhão</title>
  <style>
    :root {
      --bg: #07111f;
      --panel: #12263d;
      --primary: #1d9bf0;
      --primary-dark: #0b6bc1;
      --accent: #ffd43b;
      --success: #2ecc71;
      --danger: #e74c3c;
      --text: #f5f7fa;
      --muted: #afc4d7;
      --shadow: rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #091522 0%, #102540 100%);
      color: var(--text);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .screen {
      display: none;
      width: min(1100px, 100%);
      min-height: 720px;
      background: rgba(14, 29, 48, 0.9);
      border: 2px solid rgba(255, 255, 255, 0.08);
      border-radius: 22px;
      box-shadow: 0 18px 50px var(--shadow);
      overflow: hidden;
    }

    .screen.active {
      display: block;
    }

    #menu {
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at top, rgba(29, 155, 240, 0.28), transparent 28%),
        linear-gradient(180deg, rgba(10, 21, 36, 0.9), rgba(9, 17, 31, 1));
    }

    .menu-box {
      width: min(520px, 90%);
      text-align: center;
      padding: 36px 26px;
      border-radius: 24px;
      background: rgba(15, 30, 49, 0.9);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }

    h1 {
      margin: 0 0 20px;
      font-size: clamp(2rem, 4vw, 3rem);
      letter-spacing: 1px;
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 30px;
      font-size: 1.05rem;
    }

    .menu-actions {
      display: grid;
      gap: 14px;
      margin-top: 12px;
    }

    button {
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-size: 1.02rem;
      font-weight: 700;
      padding: 16px 22px;
      transition: transform 0.15s ease, opacity 0.15s ease, box-shadow 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .primary-btn {
      background: linear-gradient(180deg, var(--primary), var(--primary-dark));
      color: white;
      box-shadow: 0 10px 25px rgba(29, 155, 240, 0.35);
    }

    .secondary-btn {
      background: rgba(255,255,255,0.08);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.14);
    }

    .small-btn {
      padding: 10px 14px;
      font-size: 0.95rem;
    }

    .difficulty-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 18px;
    }

    .difficulty-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--text);
    }

    .difficulty-btn.active {
      background: linear-gradient(180deg, #f5b301, #d88e00);
      color: #1c1300;
      border-color: transparent;
    }

    #game {
      padding: 28px 24px 24px;
      background: linear-gradient(180deg, #0d1d2e, #102947);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .chip {
      background: rgba(255,255,255,0.06);
      padding: 12px 16px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.12);
      font-weight: 700;
    }

    #timer {
      min-width: 80px;
      text-align: center;
      background: rgba(255,212,59,0.12);
      color: var(--accent);
      border: 1px solid rgba(255,212,59,0.4);
    }

    .round-panel {
      display: grid;
      grid-template-columns: 1.3fr 0.7fr;
      gap: 20px;
    }

    .question-area {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 18px;
      padding: 20px;
      min-height: 520px;
    }

    .question-image {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.1);
      background: #0f1c2c;
    }

    .question-text {
      font-size: clamp(1.2rem, 2vw, 2rem);
      line-height: 1.4;
      margin: 18px 0 24px;
      min-height: 90px;
    }

    .answers {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .answer-btn {
      text-align: left;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--text);
      min-height: 82px;
      padding: 18px 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
    }

    .answer-btn .letter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      color: var(--text);
      font-size: 1.05rem;
      flex-shrink: 0;
    }

    .answer-btn.correct {
      background: rgba(46,204,113,0.18);
      border-color: rgba(46,204,113,0.7);
      color: #dffef1;
    }

    .answer-btn.wrong {
      background: rgba(231,76,60,0.16);
      border-color: rgba(231,76,60,0.7);
      color: #ffe4df;
    }

    .answer-btn:disabled {
      opacity: 1;
      cursor: default;
    }

    .side-panel {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 18px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .value-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }

    .value-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      font-size: 0.92rem;
      color: var(--muted);
    }

    .value-item.current {
      background: rgba(255,212,59,0.12);
      border-color: rgba(255,212,59,0.4);
      color: var(--accent);
      font-weight: 700;
    }

    .value-item.safe {
      background: rgba(46,204,113,0.08);
      border-color: rgba(46,204,113,0.25);
      color: #dffef1;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 18px;
    }

    #quit-btn {
      background: rgba(231,76,60,0.12);
      color: #ffd9d2;
      border: 1px solid rgba(231,76,60,0.5);
    }

    #result {
      padding: 40px 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #0d1c2c, #101d2f);
    }

    .result-box {
      width: min(620px, 100%);
      background: rgba(14, 27, 42, 0.96);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 22px;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 18px 50px rgba(0,0,0,0.32);
    }

    .result-box h2 {
      margin: 0 0 12px;
      font-size: clamp(1.8rem, 3vw, 2.8rem);
    }

    .result-box p {
      color: var(--muted);
      margin: 12px 0;
      font-size: 1.08rem;
    }

    .final-prize {
      font-size: clamp(1.8rem, 3vw, 2.8rem);
      color: var(--accent);
      font-weight: 800;
      margin: 14px 0 20px;
    }

    .money-rain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 10;
    }

    .money-rain.active {
      opacity: 1;
    }

    .note {
      position: absolute;
      top: -40px;
      font-size: 28px;
      animation: fall linear forwards;
      opacity: 0.9;
      text-shadow: 0 0 10px rgba(255,212,59,0.4);
    }

    @keyframes fall {
      0% {
        transform: translate3d(0, -20px, 0) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      100% {
        transform: translate3d(var(--x), 110vh, 0) rotate(var(--r));
        opacity: 0;
      }
    }

    @media (max-width: 860px) {
      .round-panel {
        grid-template-columns: 1fr;
      }

      .question-area {
        min-height: auto;
      }

      .answers {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="menu" class="screen active">
    <div class="menu-box">
      <h1>Jogo do Milhão</h1>
      <div class="subtitle">Responda 16 perguntas para conquistar o prêmio máximo.</div>

      <div class="menu-actions">
        <button id="start-btn" class="primary-btn">Iniciar</button>
        <button id="record-btn" class="secondary-btn">Recorde</button>
        <button id="settings-btn" class="secondary-btn">Configurações</button>
      </div>
    </div>
  </div>

  <div id="game" class="screen">
    <div class="topbar">
      <div id="round-info" class="chip">Pergunta 1 de 16</div>
      <div id="money-display" class="chip">R$ 0,00</div>
      <div id="timer" class="chip">60</div>
    </div>

    <div class="round-panel">
      <div class="question-area">
        <img id="question-image" class="question-image" alt="Imagem da pergunta" />
        <h2 id="question-text" class="question-text">Carregando pergunta...</h2>
        <div id="answers" class="answers"></div>

        <div class="actions">
          <button id="quit-btn" class="small-btn">Desistir</button>
        </div>
      </div>

      <aside class="side-panel">
        <h3>Valores</h3>
        <div id="value-list" class="value-list"></div>
      </aside>
    </div>
  </div>

  <div id="result" class="screen">
    <div class="result-box">
      <h2 id="result-title">Fim de jogo</h2>
      <p id="result-message">Sua partida foi encerrada.</p>
      <div id="final-prize" class="final-prize">R$ 0,00</div>
      <div class="menu-actions">
        <button id="play-again-btn" class="primary-btn">Jogar Novamente</button>
        <button id="back-menu-btn" class="secondary-btn">Menu Principal</button>
      </div>
    </div>
  </div>

  <div id="money-rain" class="money-rain" aria-hidden="true"></div>

  <script>
    const API_URL = "https://the-trivia-api.com/v2/questions?limit=30";

    const prizeTable = [
      1000, 2000, 3000, 4000, 5000,
      10000, 20000, 30000, 40000, 50000,
      100000, 200000, 300000, 400000, 500000,
      1000000
    ];

    const state = {
      selectedDifficulty: "easy",
      questions: [],
      currentIndex: 0,
      safePrize: 0,
      currentPrize: 0,
      timer: 60,
      timerId: null,
      locked: false,
      highScore: 0
    };

    const screens = {
      menu: document.getElementById("menu"),
      game: document.getElementById("game"),
      result: document.getElementById("result")
    };

    const elements = {
      roundInfo: document.getElementById("round-info"),
      moneyDisplay: document.getElementById("money-display"),
      timer: document.getElementById("timer"),
      questionImage: document.getElementById("question-image"),
      questionText: document.getElementById("question-text"),
      answers: document.getElementById("answers"),
      valueList: document.getElementById("value-list"),
      resultTitle: document.getElementById("result-title"),
      resultMessage: document.getElementById("result-message"),
      finalPrize: document.getElementById("final-prize"),
      moneyRain: document.getElementById("money-rain"),
      startBtn: document.getElementById("start-btn"),
      recordBtn: document.getElementById("record-btn"),
      settingsBtn: document.getElementById("settings-btn"),
      quitBtn: document.getElementById("quit-btn"),
      playAgainBtn: document.getElementById("play-again-btn"),
      backMenuBtn: document.getElementById("back-menu-btn")
    };

    function showScreen(name) {
      Object.keys(screens).forEach((key) => {
        screens[key].classList.toggle("active", key === name);
      });
    }

    function formatMoney(value) {
      return new Intl.NumberFormat("pt-BR", {
        style: "currency",
        currency: "BRL"
      }).format(value);
    }

    function getStoredRecord() {
      return Number(localStorage.getItem("milhaoRecord") || 0);
    }

    function saveRecord(value) {
      const record = getStoredRecord();
      if (value > record) {
        localStorage.setItem("milhaoRecord", String(value));
      }
    }

    function openRecord() {
      const record = getStoredRecord();
      alert(`Recorde atual: ${formatMoney(record)}`);
    }

    function renderDifficultyButtons() {
      const buttons = document.querySelectorAll(".difficulty-btn");
      buttons.forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.level === state.selectedDifficulty);
      });
    }

    function buildSettingsModal() {
      const existing = document.getElementById("settings-modal");
      if (existing) return;

      const modal = document.createElement("div");
      modal.id = "settings-modal";
      modal.style.position = "fixed";
      modal.style.inset = "0";
      modal.style.background = "rgba(0,0,0,0.56)";
      modal.style.display = "flex";
      modal.style.alignItems = "center";
      modal.style.justifyContent = "center";
      modal.style.zIndex = "30";
      modal.style.padding = "20px";

      const card = document.createElement("div");
      card.style.width = "min(520px, 100%)";
      card.style.background = "#12263d";
      card.style.borderRadius = "22px";
      card.style.boxShadow = "0 14px 40px rgba(0,0,0,0.35)";
      card.style.padding = "24px 22px";
      card.style.border = "1px solid rgba(255,255,255,0.1)";

      const title = document.createElement("h2");
      title.textContent = "Escolha a dificuldade";
      title.style.margin = "0 0 20px";
      title.style.textAlign = "center";

      const grid = document.createElement("div");
      grid.className = "difficulty-grid";

      const options = [
        { level: "easy", label: "Fácil" },
        { level: "medium", label: "Médio" },
        { level: "hard", label: "Difícil" },
        { level: "extreme", label: "Extremo" }
      ];

      options.forEach(({ level, label }) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "difficulty-btn";
        btn.dataset.level = level;
        btn.textContent = label;
        if (state.selectedDifficulty === level) btn.classList.add("active");

        btn.addEventListener("click", () => {
          state.selectedDifficulty = level;
          renderDifficultyButtons();
          closeSettingsModal();
        });

        grid.appendChild(btn);
      });

      const closeBtn = document.createElement("button");
      closeBtn.type = "button";
      closeBtn.className = "secondary-btn";
      closeBtn.textContent = "Fechar";
      closeBtn.style.marginTop = "18px";
      closeBtn.style.width = "100%";
      closeBtn.addEventListener("click", closeSettingsModal);

      card.append(title, grid, closeBtn);
      modal.appendChild(card);
      document.body.appendChild(modal);
    }

    function closeSettingsModal() {
      const modal = document.getElementById("settings-modal");
      if (modal) modal.remove();
    }

    function openSettings() {
      buildSettingsModal();
    }

    function buildPrizeList() {
      const values = prizeTable.map((value, index) => {
        const isCurrent = index === state.currentIndex;
        const isSafe = index < state.currentIndex;
        return `
          <div class="value-item ${isCurrent ? "current" : ""} ${isSafe ? "safe" : ""}">
            <span>P${index + 1}</span>
            <strong>${formatMoney(value)}</strong>
          </div>
        `;
      });

      elements.valueList.innerHTML = values.join("");
    }

    function setupDifficultyModal() {
      elements.settingsBtn.addEventListener("click", openSettings);
    }

    function normalizeQuestion(rawQuestion) {
      const correctAnswer = rawQuestion.correctAnswer || "";
      const allAnswers = [
        ...(Array.isArray(rawQuestion.incorrectAnswers) ? rawQuestion.incorrectAnswers : []),
        correctAnswer
      ].filter(Boolean);

      const stats = {
        question: rawQuestion.question?.text || "Pergunta não disponível",
        image: rawQuestion.image || rawQuestion.img || `https://picsum.photos/seed/${Math.random()}/800/450`,
        answers: allAnswers
          .map((answer) => String(answer).trim())
          .filter((answer, index, arr) => arr.indexOf(answer) === index)
          .sort(() => Math.random() - 0.5),
        correctAnswer: String(correctAnswer).trim(),
        difficulty: rawQuestion.difficulty || "medium"
      };

      return stats;
    }

    
const cacheTraducoes = new Map();

async function traduzirTexto(texto) {
    if (cacheTraducoes.has(texto)) {
        return cacheTraducoes.get(texto);
    }

    const parametros = new URLSearchParams({
        q: texto,
        langpair: "en|pt-BR"
    });

    const url = "https://api.mymemory.translated.net/get?" +
        parametros.toString();

    const resposta = await fetch(url);

    if (!resposta.ok) {
        throw new Error("Erro na API de tradução");
    }

    const dados = await resposta.json();

    if (
        Number(dados.responseStatus) !== 200 ||
        !dados.responseData?.translatedText
    ) {
        throw new Error("Não foi possível traduzir o texto");
    }

    const traducao = dados.responseData.translatedText;

    cacheTraducoes.set(texto, traducao);

    return traducao;
}

async function traduzirPergunta(pergunta) {
    const textos = [
        pergunta.question,
        ...pergunta.answers
    ];

    const traducoes = await Promise.all(
        textos.map(texto => traduzirTexto(texto))
    );

    const indiceCorreto = pergunta.answers.indexOf(
        pergunta.correctAnswer
    );

    if (indiceCorreto === -1) {
        throw new Error("Gabarito não encontrado");
    }

    return {
        ...pergunta,
        question: traducoes[0],
        answers: traducoes.slice(1),
        correctAnswer: traducoes[indiceCorreto + 1]
    };
}

async function traduzirPerguntas(perguntas) {
    const resultado = new Array(perguntas.length);
    let proxima = 0;

    async function trabalhador() {
        while (proxima < perguntas.length) {
            const indice = proxima++;
            resultado[indice] = await traduzirPergunta(
                perguntas[indice]
            );
        }
    }

    await Promise.all([
        trabalhador(),
        trabalhador(),
        trabalhador()
    ]);

    return resultado;
}


    async function loadQuestionsForDifficulty(level) {
      const response = await fetch(API_URL);
      if (!response.ok) {
        throw new Error("API indisponível");
      }

      const data = await response.json();
      if (!Array.isArray(data) || data.length === 0) {
        throw new Error("Sem perguntas disponíveis");
      }

      const priorityMap = {
        easy: ["easy"],
        medium: ["easy", "medium"],
        hard: ["medium", "hard"],
        extreme: ["hard"]
      };

      const allowed = priorityMap[level] || ["easy", "medium", "hard"];

      let filtered = data.filter((q) => {
        const difficulty = (q.difficulty || "medium").toLowerCase();
        return allowed.includes(difficulty);
      });

      if (filtered.length < 16) {
        filtered = data;
      }

      const selected = [];
      const usedKeys = new Set();

      while (selected.length < 16 && filtered.length > 0) {
        const index = Math.floor(Math.random() * filtered.length);
        const item = filtered.splice(index, 1)[0];
        const key = `${item.question}|${item.correctAnswer}`;

        if (!usedKeys.has(key)) {
          usedKeys.add(key);
          selected.push(normalizeQuestion(item));
        }
      }

      if (selected.length < 16) {
        const fallback = data
          .filter((q) => !selected.some((s) => s.question === (q.question || "")))
          .slice(0, 16 - selected.length);

        fallback.forEach((item) => {
          const key = `${item.question}|${item.correctAnswer}`;
          if (!usedKeys.has(key)) {
            selected.push(normalizeQuestion(item));
          }
        });
      }

      return await traduzirPerguntas(selected.slice(0, 16));
    }

    function renderQuestion() {
      const question = state.questions[state.currentIndex];
      if (!question) return;

      elements.roundInfo.textContent = `Pergunta ${state.currentIndex + 1} de ${state.questions.length}`;
      elements.moneyDisplay.textContent = formatMoney(state.safePrize);
      elements.questionImage.src = question.image;
      elements.questionImage.alt = "Imagem da pergunta";
      elements.questionText.textContent = question.question;

      const answerOptions = ["A", "B", "C", "D"];
      elements.answers.innerHTML = "";

      question.answers.forEach((answer, index) => {
        const button = document.createElement("button");
        button.className = "answer-btn";
        button.type = "button";
        button.innerHTML = `<span class="letter">${answerOptions[index]}</span><span>${answer}</span>`;
        button.addEventListener("click", () => handleAnswer(answer, button));
        elements.answers.appendChild(button);
      });

      buildPrizeList();
    }

    function clearTimer() {
      if (state.timerId) {
        clearInterval(state.timerId);
        state.timerId = null;
      }
    }

    function startTimer() {
      clearTimer();
      state.timer = 60;
      elements.timer.textContent = String(state.timer);

      state.timerId = setInterval(() => {
        state.timer -= 1;
        elements.timer.textContent = String(Math.max(0, state.timer));

        if (state.timer <= 0) {
          clearTimer();
          handleAnswer(null, null, true);
        }
      }, 1000);
    }

    function showMoneyRain() {
      elements.moneyRain.classList.add("active");
      const notes = ["💵", "💰", "💸", "💵", "💰"];

      for (let i = 0; i < 28; i++) {
        const note = document.createElement("span");
        note.className = "note";
        note.textContent = notes[Math.floor(Math.random() * notes.length)];
        note.style.left = `${Math.random() * 100}%`;
        note.style.setProperty("--x", `${(Math.random() - 0.5) * 280}px`);
        note.style.setProperty("--r", `${(Math.random() - 0.5) * 420}deg`);
        note.style.animationDuration = `${4 + Math.random() * 3}s`;
        note.style.fontSize = `${18 + Math.random() * 24}px`;
        elements.moneyRain.appendChild(note);

        setTimeout(() => {
          note.remove();
        }, 7000);
      }
    }

    async function startGame() {
      clearTimer();
      try {
        state.questions = await loadQuestionsForDifficulty(state.selectedDifficulty);
        state.currentIndex = 0;
        state.safePrize = 0;
        state.currentPrize = 0;
        state.locked = false;

        showScreen("game");
        renderQuestion();
        startTimer();
      } catch (error) {
        showResultScreen(
          "Erro ao carregar perguntas",
          "Não foi possível carregar as perguntas no momento. Tente novamente.",
          0,
          false
        );
      }
    }

    function finishGame({ won, title, message, finalPrize }) {
      clearTimer();
      saveRecord(finalPrize);
      showResultScreen(title, message, finalPrize, won);
    }

    function showResultScreen(title, message, finalPrize, won) {
      elements.resultTitle.textContent = title;
      elements.resultMessage.textContent = message;
      elements.finalPrize.textContent = formatMoney(finalPrize);

      if (won) {
        showMoneyRain();
      } else {
        elements.moneyRain.classList.remove("active");
        while (elements.moneyRain.firstChild) {
          elements.moneyRain.removeChild(elements.moneyRain.firstChild);
        }
      }

      showScreen("result");
    }

    function handleAnswer(selectedAnswer, buttonElement, timedOut = false) {
      if (state.locked) return;
      state.locked = true;
      clearTimer();

      const currentQuestion = state.questions[state.currentIndex];
      const answerButtons = [...document.querySelectorAll(".answer-btn")];
      const correctAnswer = currentQuestion.correctAnswer;

      answerButtons.forEach((btn) => {
        const text = btn.textContent.replace(/^\s*[A-D]\s*/, "").trim();
        if (text === correctAnswer) {
          btn.classList.add("correct");
        }
        btn.disabled = true;
      });

      if (buttonElement && !timedOut) {
        const text = buttonElement.textContent.replace(/^\s*[A-D]\s*/, "").trim();
        if (text === correctAnswer) {
          buttonElement.classList.add("correct");
        } else {
          buttonElement.classList.add("wrong");
        }
      }

      const isCorrect = selectedAnswer !== null && selectedAnswer === correctAnswer;

      if (isCorrect) {
        state.safePrize = prizeTable[state.currentIndex];
        state.currentPrize = state.safePrize;

        setTimeout(() => {
          if (state.currentIndex === state.questions.length - 1) {
            finishGame({
              won: true,
              title: "Você ganhou o prêmio máximo!",
              message: "Parabéns! Você conquistou o milhão.",
              finalPrize: 1000000
            });
            return;
          }

          state.currentIndex += 1;
          state.locked = false;
          renderQuestion();
          startTimer();
        }, 1100);

        return;
      }

      const earned = state.safePrize > 0 ? Math.floor(state.safePrize / 2) : 0;
      const finalValue = state.currentIndex === state.questions.length - 1 ? 0 : earned;

      const msg = timedOut
        ? "Tempo esgotado! A rodada acabou."
        : "Resposta incorreta!";

      setTimeout(() => {
        finishGame({
          won: false,
          title: "Fim de jogo",
          message: `${msg} Você levou: ${formatMoney(finalValue)}`,
          finalPrize: finalValue
        });
      }, 1100);
    }

    function quitGame() {
      clearTimer();
      const prize = state.safePrize;
      finishGame({
        won: false,
        title: "Você desistiu",
        message: `Você saiu com ${formatMoney(prize)}.`,
        finalPrize: prize
      });
    }

    function bindEvents() {
      elements.startBtn.addEventListener("click", startGame);
      elements.recordBtn.addEventListener("click", openRecord);
      elements.settingsBtn.addEventListener("click", openSettings);
      elements.quitBtn.addEventListener("click", quitGame);
      elements.playAgainBtn.addEventListener("click", startGame);
      elements.backMenuBtn.addEventListener("click", () => {
        showScreen("menu");
        clearTimer();
        elements.moneyRain.classList.remove("active");
        while (elements.moneyRain.firstChild) {
          elements.moneyRain.removeChild(elements.moneyRain.firstChild);
        }
      });
    }

    function init() {
      bindEvents();
      setupDifficultyModal();
      renderDifficultyButtons();
      showScreen("menu");
      buildPrizeList();
      elements.moneyDisplay.textContent = formatMoney(0);
    }

    init();
  </script>
</body>
</html>
