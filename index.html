<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jogo do Milhão</title>
  <style>
    :root {
      --bg: #07111f;
      --panel: #12263d;
      --primary: #1d9bf0;
      --primary-dark: #0b6bc1;
      --accent: #ffd43b;
      --success: #2ecc71;
      --danger: #e74c3c;
      --text: #f5f7fa;
      --muted: #afc4d7;
      --shadow: rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #091522 0%, #102540 100%);
      color: var(--text);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .screen {
      display: none;
      width: min(1100px, 100%);
      min-height: 720px;
      background: rgba(14, 29, 48, 0.9);
      border: 2px solid rgba(255, 255, 255, 0.08);
      border-radius: 22px;
      box-shadow: 0 18px 50px var(--shadow);
      overflow: hidden;
    }

    .screen.active {
      display: block;
    }

    #menu {
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at top, rgba(29, 155, 240, 0.28), transparent 28%),
        linear-gradient(180deg, rgba(10, 21, 36, 0.9), rgba(9, 17, 31, 1));
    }

    .menu-box {
      width: min(520px, 90%);
      text-align: center;
      padding: 36px 26px;
      border-radius: 24px;
      background: rgba(15, 30, 49, 0.9);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }

    h1 {
      margin: 0 0 20px;
      font-size: clamp(2rem, 4vw, 3rem);
      letter-spacing: 1px;
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 30px;
      font-size: 1.05rem;
    }

    .menu-actions {
      display: grid;
      gap: 14px;
      margin-top: 12px;
    }

    button {
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-size: 1.02rem;
      font-weight: 700;
      padding: 16px 22px;
      transition: transform 0.15s ease, opacity 0.15s ease, box-shadow 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .primary-btn {
      background: linear-gradient(180deg, var(--primary), var(--primary-dark));
      color: white;
      box-shadow: 0 10px 25px rgba(29, 155, 240, 0.35);
    }

    .secondary-btn {
      background: rgba(255,255,255,0.08);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.14);
    }

    .small-btn {
      padding: 10px 14px;
      font-size: 0.95rem;
    }

    .difficulty-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 18px;
    }

    .difficulty-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--text);
    }

    .difficulty-btn.active {
      background: linear-gradient(180deg, #f5b301, #d88e00);
      color: #1c1300;
      border-color: transparent;
    }

    .settings-section {
      margin-top: 20px;
      text-align: left;
    }

    .settings-section h3 {
      margin: 0 0 10px;
    }

    .settings-option {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
      padding: 11px 12px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      background: rgba(255,255,255,0.04);
      color: var(--text);
      cursor: pointer;
    }

    .settings-option input {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      accent-color: var(--primary);
    }

    html.large-text {
      font-size: 112.5%;
    }

    body.high-contrast {
      background: #000;
      color: #fff;
      --text: #fff;
      --muted: #fff;
      --accent: #ffeb3b;
    }

    body.high-contrast .screen,
    body.high-contrast .menu-box,
    body.high-contrast .question-area,
    body.high-contrast .side-panel,
    body.high-contrast .result-box,
    body.high-contrast .answer-btn,
    body.high-contrast .difficulty-btn,
    body.high-contrast .chip,
    body.high-contrast .audience-result,
    body.high-contrast .value-item,
    body.high-contrast .settings-option,
    body.high-contrast #settings-modal > div {
      background: #000 !important;
      color: #fff !important;
      border-color: #fff !important;
    }

    body.high-contrast #menu,
    body.high-contrast #game,
    body.high-contrast #result {
      background: #000 !important;
    }

    body.high-contrast .answer-btn .letter {
      background: #000;
      color: #fff;
      border: 1px solid #fff;
    }

    body.high-contrast .answer-btn.correct {
      border-color: #00ff80 !important;
    }

    body.high-contrast .difficulty-btn.active {
      background: #fff !important;
      color: #000 !important;
      border-color: #fff !important;
    }

    body.high-contrast .answer-btn.wrong,
    body.high-contrast #quit-btn {
      border-color: #ff6b6b !important;
    }

    body.high-contrast .lifeline-btn,
    body.high-contrast .secondary-btn {
      background: #000;
      color: #fff;
      border: 1px solid #fff;
    }

    body.high-contrast .primary-btn {
      background: #00549f;
      color: #fff;
      border: 1px solid #fff;
    }

    body.high-contrast #quit-btn {
      background: #000;
      color: #fff;
      border: 2px solid #ff6b6b;
    }

    body.high-contrast #timer,
    body.high-contrast .value-item.current,
    body.high-contrast .final-prize {
      color: #ffeb3b !important;
    }

    body.reduce-motion *,
    body.reduce-motion *::before,
    body.reduce-motion *::after {
      animation: none !important;
      scroll-behavior: auto !important;
      transition: none !important;
    }

    :focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    #game {
      padding: 28px 24px 24px;
      background: linear-gradient(180deg, #0d1d2e, #102947);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .chip {
      background: rgba(255,255,255,0.06);
      padding: 12px 16px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.12);
      font-weight: 700;
    }

    #timer {
      min-width: 80px;
      text-align: center;
      background: rgba(255,212,59,0.12);
      color: var(--accent);
      border: 1px solid rgba(255,212,59,0.4);
    }

    .sound-toggle {
      padding: 12px 16px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--text);
    }

    .sound-toggle[aria-pressed="true"] {
      border-color: var(--accent);
      color: var(--accent);
    }

    .round-panel {
      display: grid;
      grid-template-columns: 1.3fr 0.7fr;
      gap: 20px;
    }

    .question-area {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 18px;
      padding: 20px;
      min-height: 520px;
    }

    .question-image {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.1);
      background: #0f1c2c;
    }

    .question-text {
      font-size: clamp(1.2rem, 2vw, 2rem);
      line-height: 1.4;
      margin: 18px 0 24px;
      min-height: 90px;
    }

    .answers {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .answer-btn {
      text-align: left;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--text);
      min-height: 82px;
      padding: 18px 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
    }

    .answer-btn[hidden] {
      display: none;
    }

    .answer-btn .letter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      color: var(--text);
      font-size: 1.05rem;
      flex-shrink: 0;
    }

    .answer-btn.correct {
      background: rgba(46,204,113,0.18);
      border-color: rgba(46,204,113,0.7);
      color: #dffef1;
    }

    .answer-btn.wrong {
      background: rgba(231,76,60,0.16);
      border-color: rgba(231,76,60,0.7);
      color: #ffe4df;
    }

    .answer-btn:disabled {
      opacity: 1;
      cursor: default;
    }

    .side-panel {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 18px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .value-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }

    .value-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      font-size: 0.92rem;
      color: var(--muted);
    }

    .value-item.current {
      background: rgba(255,212,59,0.12);
      border-color: rgba(255,212,59,0.4);
      color: var(--accent);
      font-weight: 700;
    }

    .value-item.safe {
      background: rgba(46,204,113,0.08);
      border-color: rgba(46,204,113,0.25);
      color: #dffef1;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .lifeline-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .lifeline-btn {
      background: rgba(29,155,240,0.14);
      border: 1px solid rgba(29,155,240,0.45);
      color: #d8efff;
    }

    .lifeline-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .audience-result {
      margin-top: 14px;
      padding: 14px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      background: rgba(255,255,255,0.04);
    }

    .audience-result[hidden] {
      display: none;
    }

    .audience-result h3 {
      margin: 0 0 12px;
      font-size: 1rem;
    }

    .audience-votes {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px 16px;
    }

    .audience-vote {
      display: grid;
      grid-template-columns: 26px minmax(0, 1fr) 42px;
      align-items: center;
      gap: 8px;
    }

    .audience-vote-letter,
    .audience-vote-value {
      font-weight: 700;
    }

    .audience-vote-track {
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255,255,255,0.12);
    }

    .audience-vote-fill {
      height: 100%;
      border-radius: inherit;
      background: var(--primary);
    }

    .audience-vote-value {
      color: var(--accent);
      text-align: right;
      font-size: 0.9rem;
    }

    #quit-btn {
      background: rgba(231,76,60,0.12);
      color: #ffd9d2;
      border: 1px solid rgba(231,76,60,0.5);
    }

    #result {
      padding: 40px 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #0d1c2c, #101d2f);
    }

    .result-box {
      width: min(620px, 100%);
      background: rgba(14, 27, 42, 0.96);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 22px;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 18px 50px rgba(0,0,0,0.32);
    }

    .result-box h2 {
      margin: 0 0 12px;
      font-size: clamp(1.8rem, 3vw, 2.8rem);
    }

    .result-box p {
      color: var(--muted);
      margin: 12px 0;
      font-size: 1.08rem;
    }

    .final-prize {
      font-size: clamp(1.8rem, 3vw, 2.8rem);
      color: var(--accent);
      font-weight: 800;
      margin: 14px 0 20px;
    }

    .money-rain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 10;
    }

    .money-rain.active {
      opacity: 1;
    }

    .note {
      position: absolute;
      top: -40px;
      font-size: 28px;
      animation: fall linear forwards;
      opacity: 0.9;
      text-shadow: 0 0 10px rgba(255,212,59,0.4);
    }

    @keyframes fall {
      0% {
        transform: translate3d(0, -20px, 0) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      100% {
        transform: translate3d(var(--x), 110vh, 0) rotate(var(--r));
        opacity: 0;
      }
    }

    @media (max-width: 860px) {
      .round-panel {
        grid-template-columns: 1fr;
      }

      .question-area {
        min-height: auto;
      }

      .answers {
        grid-template-columns: 1fr;
      }
    }
    @media (max-width: 480px) {
      .audience-votes {
        grid-template-columns: 1fr;
      }
    }
    /* Exibe apenas a tela ativa. */
    #menu:not(.active),
    #result:not(.active) {
      display: none;
    }
  </style>
</head>
<body>
  <div id="menu" class="screen active">
    <div class="menu-box">
      <h1>Jogo do Milhão</h1>
      <div class="subtitle">Responda 16 perguntas para conquistar o prêmio máximo.</div>

      <div class="menu-actions">
        <button id="start-btn" class="primary-btn">Iniciar</button>
        <button id="record-btn" class="secondary-btn">Recorde</button>
        <button id="settings-btn" class="secondary-btn">Configurações</button>
      </div>
    </div>
  </div>

  <div id="game" class="screen">
    <div class="topbar">
      <div id="round-info" class="chip">Pergunta 1 de 16</div>
      <div id="money-display" class="chip">R$ 0,00</div>
      <button id="sound-toggle" class="chip sound-toggle" type="button" aria-pressed="false" aria-label="Alternar som">Som: desligado</button>
      <div id="timer" class="chip">60</div>
    </div>

    <div class="round-panel">
      <div class="question-area">
        <img id="question-image" class="question-image" alt="Imagem da pergunta" />
        <h2 id="question-text" class="question-text">Carregando pergunta...</h2>
        <div id="answers" class="answers"></div>

        <div class="actions">
          <div class="lifeline-actions">
            <button id="fifty-fifty-btn" class="small-btn lifeline-btn" type="button">50:50</button>
            <button id="audience-btn" class="small-btn lifeline-btn" type="button">Consultar plateia</button>
          </div>
          <button id="quit-btn" class="small-btn">Desistir</button>
        </div>
        <div id="audience-result" class="audience-result" role="status" aria-live="polite" hidden></div>
      </div>

      <aside class="side-panel">
        <h3>Valores</h3>
        <div id="value-list" class="value-list"></div>
      </aside>
    </div>
  </div>

  <div id="result" class="screen">
    <div class="result-box">
      <h2 id="result-title">Fim de jogo</h2>
      <p id="result-message">Sua partida foi encerrada.</p>
      <div id="final-prize" class="final-prize">R$ 0,00</div>
      <div class="menu-actions">
        <button id="play-again-btn" class="primary-btn">Jogar Novamente</button>
        <button id="back-menu-btn" class="secondary-btn">Menu Principal</button>
      </div>
    </div>
  </div>

  <div id="money-rain" class="money-rain" aria-hidden="true"></div>

  <script>
    const API_URL = "https://the-trivia-api.com/v2/questions?limit=30";

    const prizeTable = [
      1000, 2000, 3000, 4000, 5000,
      10000, 20000, 30000, 40000, 50000,
      100000, 200000, 300000, 400000, 500000,
      1000000
    ];

    const state = {
      selectedDifficulty: "easy",
      questions: [],
      currentIndex: 0,
      safePrize: 0,
      currentPrize: 0,
      timer: 60,
      timerId: null,
      locked: false,
      highScore: 0,
      soundEnabled: false,
      audioContext: null,
      accessibility: {
        highContrast: false,
        largeText: false,
        reduceMotion: false
      },
      aidsUsed: {
        fiftyFifty: false,
        audience: false
      }
    };

    const screens = {
      menu: document.getElementById("menu"),
      game: document.getElementById("game"),
      result: document.getElementById("result")
    };

    const elements = {
      roundInfo: document.getElementById("round-info"),
      moneyDisplay: document.getElementById("money-display"),
      timer: document.getElementById("timer"),
      questionImage: document.getElementById("question-image"),
      questionText: document.getElementById("question-text"),
      answers: document.getElementById("answers"),
      fiftyFiftyBtn: document.getElementById("fifty-fifty-btn"),
      audienceBtn: document.getElementById("audience-btn"),
      audienceResult: document.getElementById("audience-result"),
      valueList: document.getElementById("value-list"),
      resultTitle: document.getElementById("result-title"),
      resultMessage: document.getElementById("result-message"),
      finalPrize: document.getElementById("final-prize"),
      moneyRain: document.getElementById("money-rain"),
      soundToggle: document.getElementById("sound-toggle"),
      startBtn: document.getElementById("start-btn"),
      recordBtn: document.getElementById("record-btn"),
      settingsBtn: document.getElementById("settings-btn"),
      quitBtn: document.getElementById("quit-btn"),
      playAgainBtn: document.getElementById("play-again-btn"),
      backMenuBtn: document.getElementById("back-menu-btn")
    };

    function showScreen(name) {
      Object.keys(screens).forEach((key) => {
        screens[key].classList.toggle("active", key === name);
      });
    }

    function formatMoney(value) {
      return new Intl.NumberFormat("pt-BR", {
        style: "currency",
        currency: "BRL"
      }).format(value);
    }

    function getStoredRecord() {
      return Number(localStorage.getItem("milhaoRecord") || 0);
    }

    function saveRecord(value) {
      const record = getStoredRecord();
      if (value > record) {
        localStorage.setItem("milhaoRecord", String(value));
      }
    }

    function openRecord() {
      const record = getStoredRecord();
      alert(`Recorde atual: ${formatMoney(record)}`);
    }

    function renderDifficultyButtons() {
      const buttons = document.querySelectorAll(".difficulty-btn");
      buttons.forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.level === state.selectedDifficulty);
      });
    }

    function createSettingsToggle(labelText, checked, onChange) {
      const label = document.createElement("label");
      label.className = "settings-option";

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = checked;
      checkbox.addEventListener("change", () => onChange(checkbox.checked, checkbox));

      const text = document.createElement("span");
      text.textContent = labelText;

      label.append(checkbox, text);
      return label;
    }

    function applyAccessibilitySettings() {
      document.body.classList.toggle("high-contrast", state.accessibility.highContrast);
      document.documentElement.classList.toggle("large-text", state.accessibility.largeText);
      document.body.classList.toggle("reduce-motion", state.accessibility.reduceMotion);
    }

    function updateSoundToggle() {
      elements.soundToggle.textContent = `Som: ${state.soundEnabled ? "ligado" : "desligado"}`;
      elements.soundToggle.setAttribute("aria-pressed", String(state.soundEnabled));
    }

    function setSoundEnabled(enabled, checkbox = null) {
      if (!enabled) {
        state.soundEnabled = false;
        updateSoundToggle();
        if (state.audioContext && state.audioContext.state === "running") {
          state.audioContext.suspend().catch((error) => {
            console.error("Não foi possível suspender os efeitos sonoros:", error);
          });
        }
        return;
      }

      const AudioContextConstructor = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextConstructor) {
        if (checkbox) checkbox.checked = false;
        state.soundEnabled = false;
        updateSoundToggle();
        console.error("Este navegador não oferece suporte a efeitos sonoros.");
        return;
      }

      if (!state.audioContext) {
        try {
          state.audioContext = new AudioContextConstructor();
        } catch (error) {
          if (checkbox) checkbox.checked = false;
          state.soundEnabled = false;
          updateSoundToggle();
          console.error("Não foi possível iniciar os efeitos sonoros:", error);
          return;
        }
      }
      state.soundEnabled = true;
      updateSoundToggle();

      if (state.audioContext.state === "suspended") {
        state.audioContext.resume().catch((error) => {
          console.error("Não foi possível ativar os efeitos sonoros:", error);
        });
      }
    }

    function playAnswerSound(correct) {
      if (!state.soundEnabled || !state.audioContext) return;

      const context = state.audioContext;
      context.resume().then(() => {
        const frequencies = correct ? [659.25, 783.99, 987.77] : [220, 164.81];
        frequencies.forEach((frequency, index) => {
          const oscillator = context.createOscillator();
          const gain = context.createGain();
          const startTime = context.currentTime + index * 0.12;

          oscillator.type = correct ? "sine" : "triangle";
          oscillator.frequency.setValueAtTime(frequency, startTime);
          gain.gain.setValueAtTime(0.0001, startTime);
          gain.gain.exponentialRampToValueAtTime(0.08, startTime + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.18);
          oscillator.connect(gain);
          gain.connect(context.destination);
          oscillator.start(startTime);
          oscillator.stop(startTime + 0.19);
        });
      }).catch((error) => {
        console.error("Não foi possível reproduzir o efeito sonoro:", error);
      });
    }

    function buildSettingsModal() {
      const existing = document.getElementById("settings-modal");

        soundTitle,

      const accessibilitySection = document.createElement("section");
      accessibilitySection.className = "settings-section";
      const accessibilityTitle = document.createElement("h3");
      accessibilityTitle.textContent = "Acessibilidade";
      accessibilitySection.append(
        accessibilityTitle,
        createSettingsToggle("Alto contraste", state.accessibility.highContrast, (enabled) => {
          state.accessibility.highContrast = enabled;
          applyAccessibilitySettings();
        }),
        createSettingsToggle("Texto maior", state.accessibility.largeText, (enabled) => {
          state.accessibility.largeText = enabled;
          applyAccessibilitySettings();
        }),
        createSettingsToggle("Reduzir animações", state.accessibility.reduceMotion, (enabled) => {
          state.accessibility.reduceMotion = enabled;
          applyAccessibilitySettings();
        })
      );

      const closeBtn = document.createElement("button");
      closeBtn.type = "button";
      closeBtn.className = "secondary-btn";
      closeBtn.textContent = "Fechar";
      closeBtn.style.marginTop = "18px";
      closeBtn.style.width = "100%";
      closeBtn.addEventListener("click", closeSettingsModal);

      card.append(title, difficultyTitle, grid, soundSection, accessibilitySection, closeBtn);
      modal.appendChild(card);
      modal.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closeSettingsModal();
          return;
        }
        if (event.key !== "Tab") return;

        const focusable = [...modal.querySelectorAll("button:not(:disabled), input:not(:disabled)")];
        if (focusable.length === 0) return;
        const first = focusable[0];
        const last = focusable[focusable.length - 1];

        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first.focus();
        }
      });
      document.body.appendChild(modal);
      closeBtn.focus();
    }

      const modal = document.getElementById("settings-modal");
      if (modal) {
        modal.remove();

    function normalizeQuestion(rawQuestion) {
      const correctAnswer = rawQuestion.correctAnswer || "";
      const allAnswers = [
        ...(Array.isArray(rawQuestion.incorrectAnswers) ? rawQuestion.incorrectAnswers : []),
        correctAnswer
      ].filter(Boolean);

      const stats = {
        question: rawQuestion.question?.text || "Pergunta não disponível",
        image: gerarImagemPergunta(rawQuestion.question?.text || ""),
        answers: allAnswers
          .map((answer) => String(answer).trim())
          .filter((answer, index, arr) => arr.indexOf(answer) === index)
          .sort(() => Math.random() - 0.5),
        correctAnswer: String(correctAnswer).trim(),
        difficulty: rawQuestion.difficulty || "medium"
      };

      return stats;
    }

    
const cacheTraducoes = new Map();

async function traduzirTexto(texto) {
    if (cacheTraducoes.has(texto)) {
        return cacheTraducoes.get(texto);
    }

    const parametros = new URLSearchParams({
        q: texto,
        langpair: "en|pt-BR"
    });

    const url = "https://api.mymemory.translated.net/get?" +
        parametros.toString();

    const resposta = await fetch(url);

    if (!resposta.ok) {
        throw new Error("Erro na API de tradução");
    }

    const dados = await resposta.json();

    if (
        Number(dados.responseStatus) !== 200 ||
        !dados.responseData?.translatedText
    ) {
        throw new Error("Não foi possível traduzir o texto");
    }

    const traducao = dados.responseData.translatedText;

    cacheTraducoes.set(texto, traducao);

    return traducao;
}

async function traduzirPergunta(pergunta) {
    const textos = [
        pergunta.question,
        ...pergunta.answers
    ];

    const traducoes = await Promise.all(
        textos.map(texto => traduzirTexto(texto))
    );

    const indiceCorreto = pergunta.answers.indexOf(
        pergunta.correctAnswer
    );

    if (indiceCorreto === -1) {
        throw new Error("Gabarito não encontrado");
    }

    return {
        ...pergunta,
        question: traducoes[0],
        image: gerarImagemPergunta(traducoes[0]),
        answers: traducoes.slice(1),
        correctAnswer: traducoes[indiceCorreto + 1]
    };
}

async function traduzirPerguntas(perguntas) {
    const resultado = new Array(perguntas.length);
    let proxima = 0;

    async function trabalhador() {
        while (proxima < perguntas.length) {
            const indice = proxima++;
            resultado[indice] = await traduzirPergunta(
                perguntas[indice]
            );
        }
    }

    await trabalhador();

    return resultado;
}


    // Perguntas prontas em português para usar quando uma API falhar.

    ];

    function carregarPerguntasReserva() {
      const sorteadas = [...perguntasReserva].sort(() => Math.random() - 0.5);
      return sorteadas.slice(0, 16).map(([question, correctAnswer, ...erradas]) => ({
        question,
        correctAnswer,
        answers: [...erradas, correctAnswer].sort(() => Math.random() - 0.5),
        difficulty: "medium",
        image: gerarImagemPergunta(question)
      }));
    }

    // Evita insistir em traduções após o serviço começar a recusá-las.
    let apiFalhouNestaSessao = false;

    async function loadQuestionsForDifficulty(level) {
      const response = await fetch(API_URL);
      if (!response.ok) {
        throw new Error("API indisponível");
      }

      const data = await response.json();
      if (!Array.isArray(data) || data.length === 0) {
        throw new Error("Sem perguntas disponíveis");
      }

      const priorityMap = {
        easy: ["easy"],
        medium: ["easy", "medium"],
        hard: ["medium", "hard"],
        extreme: ["hard"]
      };

      const allowed = priorityMap[level] || ["easy", "medium", "hard"];

      let filtered = data.filter((q) => {
        const difficulty = (q.difficulty || "medium").toLowerCase();
        return allowed.includes(difficulty);
      });

      if (filtered.length < 16) {
        filtered = data;
      }

      const selected = [];
      const usedKeys = new Set();

      while (selected.length < 16 && filtered.length > 0) {
        const index = Math.floor(Math.random() * filtered.length);
        const item = filtered.splice(index, 1)[0];
        const key = `${item.question}|${item.correctAnswer}`;

        if (!usedKeys.has(key)) {
          usedKeys.add(key);
          selected.push(normalizeQuestion(item));
        }
      }

      if (selected.length < 16) {
        const fallback = data
          .filter((q) => !selected.some((s) => s.question === (q.question || "")))
          .slice(0, 16 - selected.length);

        fallback.forEach((item) => {
          const key = `${item.question}|${item.correctAnswer}`;
          if (!usedKeys.has(key)) {
            selected.push(normalizeQuestion(item));
          }
        });
      }

      if (selected.length < 16) {
        throw new Error("A API não forneceu 16 perguntas diferentes");
      }
      return await traduzirPerguntas(selected.slice(0, 16));
    }

    function useFiftyFifty() {
      if (state.locked || state.aidsUsed.fiftyFifty) return;

      const question = state.questions[state.currentIndex];
      const incorrectButtons = [...elements.answers.querySelectorAll(".answer-btn")]
        .filter((button) => button.dataset.answer !== question.correctAnswer);

      if (incorrectButtons.length < 2) {
        console.error("Não há duas alternativas incorretas para aplicar o 50:50.");
        elements.audienceResult.textContent = "O 50:50 não está disponível nesta pergunta.";
        elements.audienceResult.hidden = false;
        return;
      }

      for (let index = incorrectButtons.length - 1; index > 0; index--) {
        const randomIndex = Math.floor(Math.random() * (index + 1));
        [incorrectButtons[index], incorrectButtons[randomIndex]] =
          [incorrectButtons[randomIndex], incorrectButtons[index]];
      }

      incorrectButtons.slice(0, 2).forEach((button) => {
        button.hidden = true;
      });
      state.aidsUsed.fiftyFifty = true;
      elements.fiftyFiftyBtn.disabled = true;
    }

    function consultAudience() {
      if (state.locked || state.aidsUsed.audience) return;

      const question = state.questions[state.currentIndex];
      const availableButtons = [...elements.answers.querySelectorAll(".answer-btn")]
        .filter((button) => !button.hidden);
      const correctButton = availableButtons.find(
        (button) => button.dataset.answer === question.correctAnswer
      );

      if (!correctButton) {
        console.error("A resposta correta não está disponível para a votação da plateia.");
        elements.audienceResult.textContent = "A votação da plateia não está disponível nesta pergunta.";
        elements.audienceResult.hidden = false;
        return;
      }

      const correctWeight = {
        easy: 7,
        medium: 4.5,
        hard: 2.5,
        extreme: 1.5
      }[state.selectedDifficulty] || 4;
      const weights = availableButtons.map((button) =>
        button === correctButton ? correctWeight : 0.5 + Math.random()
      );
      const totalWeight = weights.reduce((sum, weight) => sum + weight, 0);
      const exactVotes = weights.map((weight) => (weight / totalWeight) * 100);
      const percentages = exactVotes.map(Math.floor);
      const remainingVotes = 100 - percentages.reduce((sum, votes) => sum + votes, 0);
      const remainderOrder = exactVotes
        .map((votes, index) => ({ index, fraction: votes - percentages[index] }))
        .sort((a, b) => b.fraction - a.fraction);

      for (let index = 0; index < remainingVotes; index++) {
        percentages[remainderOrder[index].index] += 1;
      }

      const heading = document.createElement("h3");
      heading.textContent = "Votação da plateia";
      const votes = document.createElement("div");
      votes.className = "audience-votes";

      availableButtons.forEach((button, index) => {
        const letter = button.querySelector(".letter").textContent;
        const vote = document.createElement("div");
        vote.className = "audience-vote";
        vote.setAttribute("aria-label", `${letter}: ${percentages[index]}% dos votos`);

        const label = document.createElement("span");
        label.className = "audience-vote-letter";
        label.textContent = letter;

        const track = document.createElement("div");
        track.className = "audience-vote-track";
        track.setAttribute("aria-hidden", "true");

        const fill = document.createElement("div");
        fill.className = "audience-vote-fill";
        fill.style.width = `${percentages[index]}%`;
        track.appendChild(fill);

        const percentage = document.createElement("span");
        percentage.className = "audience-vote-value";
        percentage.textContent = `${percentages[index]}%`;

        vote.append(label, track, percentage);
        votes.appendChild(vote);
      });

      elements.audienceResult.replaceChildren(heading, votes);
      elements.audienceResult.hidden = false;
      state.aidsUsed.audience = true;
      elements.audienceBtn.disabled = true;
    }

    function clearTimer() {
      if (state.timerId) {
        clearInterval(state.timerId);
        state.timerId = null;
      }
    }

    function startTimer() {
      clearTimer();
      state.timer = 60;
      elements.timer.textContent = String(state.timer);

      state.timerId = setInterval(() => {
        state.timer -= 1;
        elements.timer.textContent = String(Math.max(0, state.timer));

        if (state.timer <= 0) {
          clearTimer();
          handleAnswer(null, null, true);
        }
      }, 1000);
    }

    async function startGame() {
      clearTimer();
      try {
        if (apiFalhouNestaSessao) {
          state.questions = carregarPerguntasReserva();
        } else {
          try {
            state.questions = await loadQuestionsForDifficulty(state.selectedDifficulty);
          } catch (erroAPI) {
            console.warn("APIs indisponíveis; usando perguntas em português:", erroAPI);
            apiFalhouNestaSessao = true;
            state.questions = carregarPerguntasReserva();
          }
        }
        state.currentIndex = 0;
        state.safePrize = 0;
        state.currentPrize = 0;
        state.locked = false;
        state.aidsUsed = {
          fiftyFifty: false,
          audience: false
        };

        showScreen("game");
        renderQuestion();
        startTimer();
      } catch (error) {
        console.error("Erro ao iniciar o jogo:", error);
        showResultScreen(
          "Erro ao carregar perguntas",
          "Não foi possível carregar as perguntas no momento. Tente novamente.",
          0,
          false
        );
      }
    }

    function showResultScreen(title, message, finalPrize, won) {
      elements.resultTitle.textContent = title;
      elements.resultMessage.textContent = message;
      elements.finalPrize.textContent = formatMoney(finalPrize);

      if (won) {
        showMoneyRain();
      } else {
        elements.moneyRain.classList.remove("active");
        while (elements.moneyRain.firstChild) {
          elements.moneyRain.removeChild(elements.moneyRain.firstChild);
        }
      }

      showScreen("result");
    }

    function handleAnswer(selectedAnswer, buttonElement, timedOut = false) {
      if (state.locked) return;
      state.locked = true;
      clearTimer();

      const currentQuestion = state.questions[state.currentIndex];
      const answerButtons = [...document.querySelectorAll(".answer-btn")];
      const correctAnswer = currentQuestion.correctAnswer;

      answerButtons.forEach((btn) => {
        const text = btn.textContent.replace(/^\s*[A-D]\s*/, "").trim();
        if (text === correctAnswer) {
          btn.classList.add("correct");
        }
        btn.disabled = true;
      });

      if (buttonElement && !timedOut) {
        const text = buttonElement.textContent.replace(/^\s*[A-D]\s*/, "").trim();
        if (text === correctAnswer) {
          buttonElement.classList.add("correct");
        } else {
          buttonElement.classList.add("wrong");
        }
      }

      const isCorrect = selectedAnswer !== null && selectedAnswer === correctAnswer;
      playAnswerSound(isCorrect);

      if (isCorrect) {
        state.safePrize = prizeTable[state.currentIndex];
        state.currentPrize = state.safePrize;

        setTimeout(() => {
          if (state.currentIndex === state.questions.length - 1) {
            finishGame({
              won: true,
              title: "Você ganhou o prêmio máximo!",
              message: "Parabéns! Você conquistou o milhão.",
              finalPrize: 1000000
            });
            return;
          }

          state.currentIndex += 1;
          state.locked = false;
          renderQuestion();
          startTimer();
        }, 1100);

        return;
      }

      const earned = state.safePrize > 0 ? Math.floor(state.safePrize / 2) : 0;
      const finalValue = state.currentIndex === state.questions.length - 1 ? 0 : earned;

      const msg = timedOut
        ? "Tempo esgotado! A rodada acabou."
        : "Resposta incorreta!";

      setTimeout(() => {
        finishGame({
          won: false,
          title: "Fim de jogo",
          message: `${msg} Você levou: ${formatMoney(finalValue)}`,
          finalPrize: finalValue
        });
      }, 1100);
    }

    function quitGame() {
      clearTimer();
      const prize = state.safePrize;
      finishGame({
        won: false,
        title: "Você desistiu",
        message: `Você saiu com ${formatMoney(prize)}.`,
        finalPrize: prize
      });
    }

    function bindEvents() {
      elements.startBtn.addEventListener("click", startGame);
      elements.recordBtn.addEventListener("click", openRecord);
      elements.settingsBtn.addEventListener("click", openSettings);
      elements.soundToggle.addEventListener("click", () => {
        setSoundEnabled(!state.soundEnabled);
      });
      elements.fiftyFiftyBtn.addEventListener("click", useFiftyFifty);
      elements.audienceBtn.addEventListener("click", consultAudience);
      elements.quitBtn.addEventListener("click", quitGame);
      elements.playAgainBtn.addEventListener("click", startGame);
      elements.backMenuBtn.addEventListener("click", () => {
        showScreen("menu");
        clearTimer();
        elements.moneyRain.classList.remove("active");
        while (elements.moneyRain.firstChild) {
          elements.moneyRain.removeChild(elements.moneyRain.firstChild);
        }
      });
    }

    function init() {
      bindEvents();
      setupDifficultyModal();
      renderDifficultyButtons();
      applyAccessibilitySettings();
      updateSoundToggle();
      showScreen("menu");
      buildPrizeList();
      elements.moneyDisplay.textContent = formatMoney(0);
    }

    init();
  </script>
</body>
</html>
